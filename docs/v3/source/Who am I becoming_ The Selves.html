const ic=(k,s,c,w)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w||2.2}" stroke-linecap="round" stroke-linejoin="round">${P[k]||''}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const DASH=['#FFD23F','#FF7AB6','#4FD1C5','#A78BFA','#7DD3FC'];
// level colour helpers (level 6/7 use navy main + bright accents)
const col=s=>LV[s.level].c, tint=s=>LV[s.level].t;
const cardBg=s=>({6:'#1B1640',7:'#1B1640'})[s.level]||LV[s.level].c;
// ---- storage (optional) ----
const store={get(){try{return JSON.parse(localStorage.getItem('selves-done')||'[]')}catch(e){return []}},
 add(k){try{const d=new Set(store.get());d.add(k);localStorage.setItem('selves-done',JSON.stringify([...d]))}catch(e){}},
 clear(){try{localStorage.removeItem('selves-done')}catch(e){}}};

// ================= HOME =================
function renderHome(){
  const done=new Set(store.get());
  const lv=[...LEVELS].reverse().map(L=>{
    const items=SELVES.filter(s=>s.level===L.id);
    const cls=L.id===6?'lvl dark':L.id===7?'lvl apex':'lvl';
    const bg=L.id<6?`style="background:${L.t}"`:'';
    const numBg=L.id===6?'#FFD23F':L.id===7?L.c:L.c;
    const numCol=L.id===6?'#1B1640':'#fff';
    const label=L.id<=5?`LEVEL ${L.id}`:L.id===6?'LEVEL 6':'FINAL LEVEL';
    const tiles=items.map((s,i)=>{
      const c2=DASH[i%DASH.length];
      const iconBg=L.id===6?'rgba(255,255,255,.1)':L.id===7?'#FFF4C2':L.t;
      const iconCol=L.id===6?c2:L.c;
      const nameCol=L.id===6?'#fff':L.c;
      return `<button class="tile" style="--c2:${c2}" data-key="${s.key}" aria-label="Present ${esc(s.name)}: story of ${esc(s.fig.name)}">
        ${done.has(s.key)?`<span class="done" title="Presented">${ic('tick',16,'#fff',3)}</span>`:''}
        <span class="tile-ic" style="background:${iconBg}">${ic(s.icon,22,iconCol,2.3)}</span>
        <span class="tile-name" style="color:${nameCol}">${esc(s.name)}</span>
        <span class="tile-short">${esc(s.short)}</span>
        <span class="tile-fig">${ic(s.fig.icon,15,'currentColor',2.4)}${esc(s.fig.name)}</span>
      </button>`}).join('');
    return `<section class="${cls}" ${bg} aria-labelledby="lv${L.id}">
      <div class="lvl-head" style="color:${L.id===6?'#fff':L.c}">
        <div class="lvl-num" style="background:${numBg};color:${numCol}">${L.id===7?ic('star',24,'#FFD23F',2.4):L.id}</div>
        <div class="lvl-tag">${label}</div>
        <div class="lvl-name" id="lv${L.id}">${esc(L.name)}</div>
        <div class="lvl-q">${esc(L.q)}</div>
      </div>
      <div class="tiles">${tiles}</div></section>`;}).join('');
  document.getElementById('home').innerHTML=`
   <div class="blob" aria-hidden="true" style="top:-150px;right:-120px;width:400px;height:400px;background:#FFD23F"></div>
   <div class="blob" aria-hidden="true" style="top:150px;right:260px;width:66px;height:66px;background:#FF7AB6"></div>
   <div class="blob" aria-hidden="true" style="top:46px;right:340px;width:30px;height:30px;background:#4FD1C5"></div>
   <header class="hero">
     <div>
       <span class="kick">THE CHARACTER PROJECT · GROUNDWORK</span>
       <h1>Who am I <span class="hl">becoming?</span></h1>
       <p>26 selves, 26 five-minute stories. Start at Level 1 at the bottom and level up. Tap any self to present it.</p>
     </div>
     <div class="hero-btns">
       <button class="pill-btn solid" id="startBtn">${ic('rocket',20,'#fff')}Start at Level 1</button>
       <button class="pill-btn" id="guideBtn">${ic('help',20,'#1B1640')}How to present</button>
     </div>
   </header>
   <div class="levels">${lv}</div>
   <footer class="foot"><span>St Paul’s School · Year 9</span><em>create your own story.</em></footer>`;
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openDeck(b.dataset.key,0));
  document.getElementById('startBtn').onclick=()=>openDeck(SELVES[0].key,0);
  document.getElementById('guideBtn').onclick=openGuide;
}

// ================= GUIDE =================
function openGuide(){
  const g=document.getElementById('guide');
  g.innerHTML=`<h2 id="guide-h">How to present</h2>
  <p>Each self is a five-minute, story-led talk in five slides: <b>the hook</b>, <b>the story</b>, <b>what it is and isn’t</b>, <b>ask yourself</b> and <b>Living It</b>. The timer starts on your first click.</p>
  <h3>Keys (or a presentation clicker)</h3>
  <p><kbd>→</kbd> <kbd>Space</kbd> next (reveals story beats one at a time) · <kbd>←</kbd> back · <kbd>N</kbd> speaker notes · <kbd>T</kbd> pause timer · <kbd>F</kbd> full screen · <kbd>Esc</kbd> back to the map</p>
  <h3>Suggested timing</h3>
  <ul><li>Hook: 20 seconds. Ask the question, don’t answer it.</li><li>Story: 90 seconds. One beat per click.</li><li>Is / isn’t: 60 seconds.</li><li>Ask yourself: 20 seconds silent, then 30 seconds turn and talk.</li><li>Living It: 45 seconds.</li></ul>
  <h3>About the story cards</h3>
  <p>The cards are designed graphics, not photos. Tell the story yourself, and show an official clip only after you've checked its classification and licensing.</p>
  <h3>Sources</h3>
  <ul class="src-list">${SELVES.map(s=>`<li><b>${esc(s.name)}:</b> ${esc(s.src)}</li>`).join('')}</ul>
  <p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="pill-btn solid" id="gClose">Close</button><button class="pill-btn" id="gReset">Clear “presented” ticks</button></p>`;
  g.showModal();
  g.querySelector('#gClose').onclick=()=>g.close();
  g.querySelector('#gReset').onclick=()=>{store.clear();renderHome();g.close();};
}

// ================= DECK =================
const st={i:0,slide:0,step:0,timer:300,running:false,started:false,tt:null,ttLeft:0,notes:false};
const NSLIDES=5;
const cur=()=>SELVES[st.i];
function stepsFor(slide){const s=cur(); if(slide===1) return s.beats.length+1; if(slide===2) return 2; return 1;}
function openDeck(key,slide){
  st.i=SELVES.findIndex(s=>s.key===key); st.slide=slide||0; st.step=0;
  st.timer=300; st.running=false; st.started=false; st.notes=false; stopTT();
  document.getElementById('deck').classList.add('on'); document.getElementById('home').style.display='none';
  fit(); draw(); history.replaceState(null,'','#'+key);
}
function closeDeck(){stopTT();st.running=false;document.getElementById('deck').classList.remove('on');document.getElementById('home').style.display='';
  if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}} history.replaceState(null,'',' '); renderHome();}
function fit(){const sc=Math.min(innerWidth/1600,innerHeight/900);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${sc})`;}
addEventListener('resize',fit);

function storyCard(s,size){
  const big=size==='big', bg=cardBg(s);
  const fs=big?(s.fig.name.length>16?84:s.fig.name.length>11?98:112):(s.fig.name.length>16?50:58);
  return `<div class="card" style="background:${bg};${big?'height:100%':'height:100%;padding:34px'}">
    <span class="ring" style="width:520px;height:520px;right:-180px;top:-140px"></span>
    <span class="ring" style="width:300px;height:300px;right:-60px;top:-20px;border-color:rgba(255,210,63,.35)"></span>
    <span class="ring" style="width:160px;height:160px;left:-50px;bottom:120px;background:rgba(255,255,255,.06);border:none"></span>
    <span class="kind" style="color:${bg}">${ic(s.fig.icon,20,bg,2.4)}${esc(s.fig.kind.toUpperCase())}</span>
    ${big?`<span class="big-ic">${ic(s.fig.icon,64,'#FFD23F',2)}</span>`:''}
    <div class="fname" style="font-size:${fs}px">${esc(s.fig.name)}</div>
    <div class="fsub" style="font-size:${big?28:22}px">${esc(s.fig.sub)}</div>
    <div class="fmom" style="font-size:${big?26:20}px">${esc(s.fig.moment)}</div>
  </div>`;
}
function draw(){
  const s=cur(), L=LV[s.level], c=col(s), t=tint(s);
  const accent=s.level>=6?'#1B1640':c;
  const lvLabel=s.level<=5?`LEVEL ${s.level} · ${L.name.toUpperCase()}`:s.level===6?`LEVEL 6 · IMAGINE MYSELF`:`FINAL LEVEL`;
  const tVal=fmt(st.timer);
  const tCls=st.timer<=0?'timer over':st.timer<=60?'timer warn':'timer';
  let body='';
  if(st.slide===0){
    body=`<div class="s1"><div class="left">
      <div class="lvtag" style="color:${accent}">${esc(lvLabel)}</div>
      <h2>${esc(s.name)}</h2>
      <p class="short">${esc(s.short)}</p>
      <div class="bubble" style="background:${s.level===7?'#FFD23F':t};border-bottom-color:${s.level===7?'#FFD23F':t}">${esc(s.hook)}</div>
    </div>${storyCard(s,'big')}</div>`;
  } else if(st.slide===1){
    const shown=st.step; // number of beats shown (0..n), turn shown when step===n+? 
    const beats=s.beats.map((b,k)=>`<div class="beat ${k>=shown+1?'hide':''} ${k<shown&&shown<=s.beats.length&&k<shown-0&&k!==shown?'':''}">
        <span class="n" style="background:${k<=shown?accent:'#B8B1CC'}">${k+1}</span><span>${esc(b)}</span></div>`).join('');
    const showTurn=st.step>=s.beats.length;
    body=`<div class="s2"><div>${storyCard(s,'small')}</div>
      <div class="beats">${beats}<div class="turn ${showTurn?'':'hide'}">${esc(s.turn)}</div></div></div>`;
  } else if(st.slide===2){
    body=`<div class="s3">
      <div class="panel" style="background:${s.level===7?'#FFF4C2':t}"><h3 style="color:${accent}"><span class="ph-ic" style="background:${accent}">${ic('tick',36,'#fff',3)}</span>What it is</h3><p>${esc(s.is_)}</p></div>
      <div class="panel not ${st.step<1?'hide':''}"><h3 style="color:#4A4660"><span class="ph-ic" style="background:#E6E3F0">${ic('x',34,'#4A4660',3)}</span>What it isn’t</h3><p>${esc(s.isnt)}</p></div>
    </div>`;
  } else if(st.slide===3){
    body=`<div class="s4">
      <span class="eyebrow" style="background:${accent}">${ic('chat',26,'#fff')}ASK YOURSELF</span>
      <p class="q">${esc(s.ask)}</p>
      <div class="row"><button class="tt-btn" id="ttBtn">${ringSVG()}<span id="ttLabel">Turn and talk · 30s</span></button>
      <span class="hint">Think silently for 20 seconds first. Sharing is optional.</span></div>
    </div>`;
  } else {
    const nxt=SELVES[st.i+1];
    body=`<div class="s5">
      <div class="living" style="background:${s.level>=6?'#1B1640':c}"><span class="li-ic">${ic('rocket',60,'#FFD23F',2)}</span>
        <div><small>LIVING IT · THIS WEEK</small><p>${esc(s.living)}</p></div></div>
      <div class="links">
        <div class="lk"><b style="color:${accent}">THE CHARACTER PROJECT</b><p>${esc(s.cp)}</p></div>
        <div class="lk"><b style="color:${accent}">IN GROUNDWORK</b><p>${esc(s.gw)}</p></div>
      </div>
      <div class="s5-foot"><span class="help">Need to talk? <b>Your tutor, the Year 9 Coordinator or the school counsellor</b> · Kids Helpline <b>1800 55 1800</b></span>
        <span class="end-btns"><button class="big-btn" id="mapBtn">${ic('home',22,'#1B1640')}Map</button>${nxt?`<button class="big-btn solid" id="nextSelf">Next: ${esc(nxt.name)} ${ic('right',22,'#fff',2.6)}</button>`:''}</span></div>
    </div>`;
    store.add(s.key);
  }
  const dots=[...Array(NSLIDES)].map((_,k)=>`<button class="dot ${k===st.slide?'on':''}" style="${k===st.slide?`background:${accent}`:''}" aria-label="Slide ${k+1}" data-k="${k}"></button>`).join('');
  const nSteps=stepsFor(st.slide);
  const notes=s.notes[st.slide]||'';
  document.getElementById('stage').innerHTML=`
    <div class="bar">
      <div class="bar-l"><button class="ibtn" id="homeBtn" aria-label="Back to the map">${ic('home',26,'#1B1640')}</button>
        <span class="chip" style="background:${accent}">${ic(s.icon,20,s.level>=6?'#FFD23F':'#fff',2.4)}${esc(s.name.toUpperCase())}</span></div>
      <div class="dots" role="group" aria-label="Slides">${dots}</div>
      <div class="bar-r"><button class="${tCls}" id="timerBtn" aria-label="Timer, ${tVal}. ${st.running?'Pause':'Start'}">${ic('clock',24,'currentColor')}${tVal}</button>
        <button class="ibtn" id="notesBtn" aria-label="Speaker notes" aria-pressed="${st.notes}">${ic('notes',26,'#1B1640')}</button>
        <button class="ibtn" id="fsBtn" aria-label="Full screen">${ic('expand',26,'#1B1640')}</button></div>
    </div>
    <div class="slide">${body}</div>
    ${nSteps>1?`<div class="stepper">${Math.min(st.step+1,nSteps)} / ${nSteps}</div>`:''}
    <div class="nav"><button class="ibtn" id="prevBtn" aria-label="Back">${ic('left',28,'#1B1640',2.6)}</button><button class="ibtn" id="nextBtn" aria-label="Next" style="background:${accent};border-color:${accent}">${ic('right',28,'#fff',2.6)}</button></div>
    <div id="notes" class="${st.notes?'on':''}" role="note"><h4>SPEAKER NOTES · SLIDE ${st.slide+1} OF 5</h4><p>${esc(notes)}</p><p class="s">Source: ${esc(s.src)}</p></div>`;
  wire();
}
function wire(){
  const $=id=>document.getElementById(id);
  $('homeBtn').onclick=closeDeck; $('prevBtn').onclick=prev; $('nextBtn').onclick=next;
  $('timerBtn').onclick=toggleTimer; $('notesBtn').onclick=()=>{st.notes=!st.notes;draw();};
  $('fsBtn').onclick=fullscreen;
  document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{st.slide=+d.dataset.k;st.step=0;startTimer();draw();});
  if($('ttBtn')) $('ttBtn').onclick=startTT;
  if($('mapBtn')) $('mapBtn').onclick=closeDeck;
  if($('nextSelf')) $('nextSelf').onclick=()=>openDeck(SELVES[st.i+1].key,0);
}
function next(){startTimer(); const n=stepsFor(st.slide);
  if(st.step<n-1){st.step++;} else if(st.slide<NSLIDES-1){st.slide++;st.step=0;stopTT();} draw();}
function prev(){ if(st.step>0){st.step--;} else if(st.slide>0){st.slide--;st.step=stepsFor(st.slide)-1;stopTT();} draw();}
function fullscreen(){try{const p=!document.fullscreenElement?document.documentElement.requestFullscreen():document.exitFullscreen(); if(p&&p.catch)p.catch(()=>{});}catch(e){}}
// main timer
let tick=null;
function fmt(t){const a=Math.abs(t),m=Math.floor(a/60),s=a%60;return (t<0?'-':'')+m+':'+String(s).padStart(2,'0');}
function startTimer(){ if(st.started) return; st.started=true; st.running=true; ensureTick(); }
function toggleTimer(){ st.started=true; st.running=!st.running; ensureTick(); updTimer(); }
function ensureTick(){ if(!tick) tick=setInterval(()=>{ if(st.running && document.getElementById('deck').classList.contains('on')){ st.timer--; updTimer(); } },1000); }
function updTimer(){const b=document.getElementById('timerBtn'); if(!b) return;
  b.className=st.timer<=0?'timer over':st.timer<=60?'timer warn':'timer'; b.lastChild.nodeValue=fmt(st.timer);
  b.setAttribute('aria-label',`Timer, ${fmt(st.timer)}. ${st.running?'Pause':'Start'}`);}
// turn & talk timer
function ringSVG(){return `<svg class="tt-ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" fill="none" stroke="#E6E3F0" stroke-width="6"/><circle id="ttArc" cx="26" cy="26" r="22" fill="none" stroke="#C2185B" stroke-width="6" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0" transform="rotate(-90 26 26)"/></svg>`;}
function startTT(){ stopTT(); startTimer(); st.ttLeft=30; paintTT(); st.tt=setInterval(()=>{st.ttLeft--; paintTT(); if(st.ttLeft<=0){stopTT(); const l=document.getElementById('ttLabel'); if(l) l.textContent='Time! Who wants to share?';}},1000); }
function paintTT(){const a=document.getElementById('ttArc'),l=document.getElementById('ttLabel'); if(!a) return; a.setAttribute('stroke-dashoffset',String(138.2*(1-st.ttLeft/30))); if(l&&st.ttLeft>0) l.textContent=`Turn and talk · ${st.ttLeft}s`;}
function stopTT(){ if(st.tt){clearInterval(st.tt); st.tt=null;} }
// keys
addEventListener('keydown',e=>{
  if(!document.getElementById('deck').classList.contains('on')) return;
  if(document.getElementById('guide').open) return;
  const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){ if((k==='Enter'||k===' ')&&document.activeElement&&document.activeElement.tagName==='BUTTON') return; e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
  else if(k==='Escape'){ if(!document.fullscreenElement) closeDeck(); }
  else if(k==='n'||k==='N'){ st.notes=!st.notes; draw(); }
  else if(k==='t'||k==='T'){ toggleTimer(); }
  else if(k==='f'||k==='F'){ fullscreen(); }
});
renderHome();
function route(){const h=decodeURIComponent(location.hash.slice(1)); if(h && SELVES.some(s=>s.key===h)){ if(!(document.getElementById('deck').classList.contains('on')&&cur().key===h)) openDeck(h,0);} }
route(); addEventListener('hashchange',route);
</script>
</body>
</html>
