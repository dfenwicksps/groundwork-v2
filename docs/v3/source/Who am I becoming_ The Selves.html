<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who am I becoming? The Selves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{--navy:#1B1640;--yel:#FFD23F;--bg:#FFFBF3;--ink:#1E1E2A;--muted:#4A4660;
--hf:'Bricolage Grotesque','Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;--bf:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #0B7A6E;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- HOME ---------- */
#home{max-width:1240px;margin:0 auto;padding:40px 24px 56px;position:relative}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.hero{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.kick{display:inline-block;padding:7px 14px;background:var(--navy);color:#fff;border-radius:999px;font-weight:800;letter-spacing:.12em;font-size:13px}
.hero h1{font-family:var(--hf);font-weight:800;font-size:clamp(44px,7vw,84px);line-height:.98;letter-spacing:-.03em;color:var(--navy);margin:12px 0 10px}
.hl{background:var(--yel);padding:0 10px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{margin:0;font-size:19px;font-weight:600;color:#3A3550;max-width:620px;line-height:1.4}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.pill-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:2px solid var(--navy);background:#fff;font-weight:800;color:var(--navy)}
.pill-btn.solid{background:var(--navy);color:#fff}
.pill-btn:hover{transform:translateY(-1px)}
.levels{display:flex;flex-direction:column;gap:14px;position:relative}
.lvl{border-radius:24px;padding:16px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
.lvl-head{display:flex;flex-direction:column;justify-content:center;gap:3px}
.lvl-num{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-weight:800;font-size:24px;color:#fff}
.lvl-tag{font-size:12px;font-weight:800;letter-spacing:.12em;margin-top:4px}
.lvl-name{font-family:var(--hf);font-weight:800;font-size:20px;line-height:1.05}
.lvl-q{font-size:15px;font-weight:700;color:#2E2A3D}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;border:2px solid transparent;background:#fff;min-height:44px;transition:transform .12s, box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(27,22,64,.12)}
.tile-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tile-name{font-family:var(--hf);font-weight:800;font-size:19px;line-height:1.1}
.tile-short{font-size:15px;font-weight:600;line-height:1.3;color:#2A2A33}
.tile-fig{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--muted)}
.done{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0B7A6E}
.lvl.dark{background:var(--navy);color:#fff}
.lvl.dark .lvl-q{color:var(--yel)}
.lvl.dark .tile{background:transparent;border:2.5px dashed var(--c2);color:#fff}
.lvl.dark .tile-short{color:#E9E6FF}.lvl.dark .tile-fig{color:#C9C3EE}
.lvl.apex{background:var(--yel);border:3px solid var(--navy);color:var(--navy)}
.lvl.apex .tile{border:2px solid var(--navy)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:22px;font-weight:800;color:var(--navy)}
.foot em{font-family:var(--hf);font-style:normal}
@media (max-width:700px){.lvl{grid-template-columns:1fr}}
/* ---------- DIALOG ---------- */
dialog{border:none;border-radius:24px;max-width:720px;width:calc(100% - 32px);padding:28px;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(27,22,64,.55)}
dialog h2{font-family:var(--hf);font-size:30px;margin:0 0 10px;color:var(--navy)}
dialog h3{font-family:var(--hf);font-size:20px;margin:18px 0 6px;color:var(--navy)}
dialog p,dialog li{font-size:16px;line-height:1.5}
kbd{display:inline-block;min-width:28px;padding:2px 8px;border-radius:7px;border:2px solid #CFC8B4;border-bottom-width:3px;font-family:var(--bf);font-weight:800;font-size:14px;text-align:center;background:#FFFBF3}
.src-list{font-size:14px;line-height:1.45;color:#333;padding-left:18px}
/* ---------- DECK ---------- */
#deck{position:fixed;inset:0;background:#120F2E;display:none;overflow:hidden}
#deck.on{display:block}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:var(--bg);overflow:hidden;border-radius:6px}
.bar{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:20px;z-index:5}
.bar-l{display:flex;align-items:center;gap:14px}
.ibtn{width:52px;height:52px;border-radius:16px;border:2px solid rgba(27,22,64,.18);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{border-color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;color:#fff;font-weight:800;font-size:17px;letter-spacing:.06em}
.dots{display:flex;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(27,22,64,.18);border:none;padding:0}
.dot.on{width:40px;border-radius:999px}
.bar-r{display:flex;align-items:center;gap:10px}
.timer{min-width:128px;height:52px;padding:0 18px;border-radius:16px;border:2px solid rgba(27,22,64,.18);background:#fff;font-family:var(--hf);font-weight:800;font-size:26px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}
.timer.warn{background:#FFE8D6;border-color:#C2410C;color:#9A3412}
.timer.over{background:#FDE1EC;border-color:#C2185B;color:#9D174D}
.slide{position:absolute;left:0;right:0;top:84px;bottom:0;padding:24px 72px 64px;display:flex;flex-direction:column}
.nav{position:absolute;right:36px;bottom:24px;display:flex;gap:10px;z-index:6}
.stepper{position:absolute;left:72px;bottom:30px;font-weight:800;font-size:16px;color:var(--muted)}
/* story card */
.card{position:relative;border-radius:40px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:44px}
.card .ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.18)}
.card .kind{position:absolute;top:36px;left:40px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:999px;padding:8px 16px;font-weight:800;font-size:18px;letter-spacing:.08em}
.card .big-ic{position:absolute;top:36px;right:40px;width:120px;height:120px;border-radius:32px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.card .fname{font-family:var(--hf);font-weight:800;line-height:.98;letter-spacing:-.02em}
.card .fsub{font-weight:700;opacity:.95;margin-top:10px}
.card .fmom{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:16px;font-weight:800;color:var(--navy);background:var(--yel);align-self:flex-start}
/* slide 1 */
.s1{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;height:100%;align-items:stretch}
.s1 .left{display:flex;flex-direction:column;justify-content:center;gap:18px}
.lvtag{font-weight:800;letter-spacing:.14em;font-size:20px}
.s1 h2{font-family:var(--hf);font-weight:800;font-size:124px;line-height:.92;letter-spacing:-.035em;margin:0;color:var(--navy)}
.s1 .short{font-size:30px;font-weight:700;color:#3A3550;line-height:1.3;margin:0}
.bubble{position:relative;margin-top:18px;padding:26px 30px;border-radius:28px;font-family:var(--hf);font-weight:800;font-size:40px;line-height:1.12;color:var(--navy)}
.bubble:after{content:"";position:absolute;left:46px;top:-18px;border:18px solid transparent;border-top:0;border-bottom-color:inherit}
/* slide 2 */
.s2{display:grid;grid-template-columns:420px minmax(0,1fr);gap:48px;height:100%}
.beats{display:flex;flex-direction:column;gap:14px;justify-content:center}
.beat{display:grid;grid-template-columns:54px minmax(0,1fr);gap:18px;align-items:start;font-size:29px;line-height:1.32;font-weight:600;transition:opacity .35s, transform .35s}
.beat .n{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--hf);font-weight:800;font-size:26px;color:#fff}
.beat.hide{opacity:0;transform:translateY(12px)}
.beat.dim{opacity:.45}
.turn{margin-top:8px;padding:22px 28px;border-radius:24px;background:var(--yel);color:var(--navy);font-family:var(--hf);font-weight:800;font-size:33px;line-height:1.18;border:3px solid var(--navy);transition:opacity .35s, transform .35s}
.turn.hide{opacity:0;transform:translateY(12px)}
/* slide 3 */
.s3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;height:100%;align-items:center}
.s3 .panel{min-height:470px}
.panel{border-radius:36px;padding:44px;display:flex;flex-direction:column;gap:22px;transition:opacity .35s, transform .35s}
.panel.hide{opacity:0;transform:translateY(14px)}
.panel h3{display:flex;align-items:center;gap:16px;margin:0;font-family:var(--hf);font-weight:800;font-size:46px}
.panel .ph-ic{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.panel p{margin:0;font-size:34px;line-height:1.36;font-weight:600}
.panel.not{background:#fff;border:4px dashed #B8B1CC}
/* slide 4 */
.s4{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:30px;height:100%;max-width:1320px}
.s4 .eyebrow{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;color:#fff;font-weight:800;font-size:22px;letter-spacing:.1em}
.s4 .q{font-family:var(--hf);font-weight:800;font-size:68px;line-height:1.08;letter-spacing:-.02em;color:var(--navy);margin:0}
.s4 .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tt-btn{display:inline-flex;align-items:center;gap:14px;min-height:72px;padding:12px 28px 12px 14px;border-radius:999px;border:3px solid var(--navy);background:#fff;font-weight:800;font-size:26px;color:var(--navy)}
.tt-ring{width:52px;height:52px}
.hint{font-size:22px;font-weight:700;color:var(--muted)}
/* slide 5 */
.s5{display:flex;flex-direction:column;gap:24px;height:100%}
.s5-foot{margin-top:auto}
.living{border-radius:36px;padding:40px 48px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:30px;align-items:center;color:#fff}
.living .li-ic{width:110px;height:110px;border-radius:32px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.living small{display:block;font-weight:800;letter-spacing:.14em;font-size:20px;opacity:.95;margin-bottom:8px}
.living p{margin:0;font-family:var(--hf);font-weight:800;font-size:42px;line-height:1.16}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.lk{border-radius:28px;padding:28px 32px;background:#fff;border:3px solid rgba(27,22,64,.12);display:flex;flex-direction:column;gap:10px}
.lk b{font-weight:800;letter-spacing:.12em;font-size:18px}
.lk p{margin:0;font-size:28px;font-weight:600;line-height:1.32}
.s5-foot{display:flex;justify-content:space-between;align-items:center;gap:20px}
.help{font-size:19px;font-weight:700;color:var(--muted)}
.help b{color:var(--navy)}
.end-btns{display:flex;gap:12px}
.big-btn{display:inline-flex;align-items:center;gap:10px;min-height:60px;padding:12px 24px;border-radius:999px;border:3px solid var(--navy);background:#fff;font-weight:800;font-size:21px;color:var(--navy)}
.big-btn.solid{background:var(--navy);color:#fff}
/* notes */
#notes{position:absolute;left:36px;right:36px;bottom:20px;z-index:8;background:var(--navy);color:#fff;border-radius:24px;padding:22px 28px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#notes.on{display:block}
#notes h4{margin:0 0 6px;font-weight:800;letter-spacing:.12em;font-size:16px;color:var(--yel)}
#notes p{margin:0 0 8px;font-size:24px;line-height:1.4;font-weight:600}
#notes .s{font-size:17px;color:#C9C3EE;margin:6px 0 0}
</style>
</head>
<body>
<main id="home" aria-label="The Selves map"></main>
<section id="deck" aria-label="Presentation" aria-live="polite"><div id="stage"></div></section>
<dialog id="guide" aria-labelledby="guide-h"></dialog>
<script>
const LEVELS = [{"id": 1, "name": "Know myself", "q": "Who am I, really?", "c": "#0B7A6E", "t": "#D5F5EF"}, {"id": 2, "name": "Value myself", "q": "Do I rate who I am?", "c": "#C2185B", "t": "#FDE1EC"}, {"id": 3, "name": "Manage myself", "q": "Can I steer myself?", "c": "#C2410C", "t": "#FFE8D6"}, {"id": 4, "name": "Believe in myself", "q": "Can I actually do this?", "c": "#6D28D9", "t": "#EDE4FF"}, {"id": 5, "name": "Direct myself", "q": "Where am I heading?", "c": "#1D4ED8", "t": "#DCE8FF"}, {"id": 6, "name": "Imagine myself", "q": "Who could I be?", "c": "#1B1640", "t": "#E6E3F7"}, {"id": 7, "name": "Final level", "q": "Am I being the real me?", "c": "#1B1640", "t": "#FFD23F"}];
const SELVES = [{"key": "self-awareness", "name": "Self-awareness", "level": 1, "icon": "eye", "short": "Noticing what's going on inside me, as it happens.", "fig": {"kind": "Film", "name": "Inside Out", "sub": "Pixar, 2015", "moment": "The control room in Riley's head", "icon": "film"}, "hook": "What if you couldn't tell what you were actually feeling?", "beats": ["Riley is 11 and has just moved cities. Inside her head, five emotions run a control panel: Joy, Sadness, Anger, Fear and Disgust.", "Joy keeps stopping Sadness from touching anything. So Riley keeps smiling for everyone, even though she's miserable.", "Bottling it up makes things worse. Riley starts to feel almost nothing, and nearly runs away from home.", "The turn: when Sadness finally gets the controls, Riley tells her parents how she really feels, and they help."], "turn": "Riley couldn't sort out what she wouldn't notice. Naming the feeling was step one.", "is_": "Noticing what's going on inside you (thoughts, feelings, body signals) while it's happening, and being able to name it: \"I'm not angry, I'm embarrassed.\"", "isnt": "Not being self-conscious. Self-conscious is worrying how you look to everyone else. Self-aware is noticing what's actually happening in you.", "ask": "If you had to name the emotion at your control panel right now, what would it be? Is it the one showing on your face?", "living": "Three times this week, stop and name the feeling under the feeling. What's above the waterline, and what's below?", "cp": "The iceberg principle: what shows on the surface versus what sits underneath.", "gw": "Mission 1, Your Story So Far, and the journal.", "notes": ["Hands up if you've seen Inside Out. Most will have. Inside Out 2 (2024) adds Anxiety if anyone mentions it.", "Pause after beat 2: 'Why would Joy not want Sadness near the controls?'", "Draw the line back to the iceberg they already know.", "Give 20 seconds of silent thinking before anyone shares. No one has to share.", "Challenge is private. Suggest a phone-free note (paper or planner)."], "src": "Inside Out (Pixar, 2015). Goleman (1995) on emotional self-awareness."}, {"key": "self-reflection", "name": "Self-reflection", "level": 1, "icon": "rewind", "short": "Looking back with curiosity, and coming out with something.", "fig": {"kind": "Sport", "name": "Michael Jordan", "sub": "Nike 'Failure' ad, 1997", "moment": "An ad about his misses, not his wins", "icon": "trophy"}, "hook": "Why would the greatest basketballer ever make an ad about failing?", "beats": ["1997: Michael Jordan is the most famous athlete on the planet, with five NBA titles.", "Nike makes an ad where he doesn't mention a single win. He lists his misses: over 9,000 shots, almost 300 games lost, 26 game-winners missed.", "His point: failing over and over is why he succeeded.", "The misses weren't the magic. Looking back at each one and working out what to fix was."], "turn": "Reflection asks 'what happened, and what next?' Replaying 'why am I so bad at this?' on a loop gets you nowhere.", "is_": "Thinking back over what happened the way you'd look at a mate's situation: interested, not prosecuting. What happened? What was I feeling? What will I try next time?", "isnt": "Not going over it. Replaying the same bad moment and the same harsh verdict feels like reflecting, but it leaves you flatter, not clearer. The tell is whether it lands somewhere.", "ask": "Think of your last miss: a test, a game, an argument. Did you come out of thinking about it with something to try, or just feeling worse?", "living": "After one thing this week that doesn't go to plan, run the 3-question debrief: What happened? What was going on for me? What will I try next time? Then stop.", "cp": "Coming up: Session 9, Failure and Resilience.", "gw": "The journal, and the 'hard on yourself' card that catches the looping kind.", "notes": ["If anyone has seen The Last Dance, let them add a detail.", "Ask after beat 2: 'Why list misses instead of wins?'", "Stress the difference: reflecting lands somewhere; looping doesn't. If you're looping, move your body or talk it through.", "Model your own example of a miss and what you took from it.", "The 3 questions fit on a sticky note."], "src": "Nike 'Failure' (1997). Trapnell & Campbell (1999) on reflection vs rumination."}, {"key": "self-concept", "name": "Self-concept", "level": 1, "icon": "user", "short": "The whole picture I hold of who I am.", "fig": {"kind": "Sport", "name": "Dylan Alcott", "sub": "Paralympian, 2022 Australian of the Year", "moment": "Golden Slam, 2021", "icon": "trophy"}, "hook": "How many different things can one person be?", "beats": ["Dylan Alcott was born with a tumour wrapped around his spinal cord and has used a wheelchair since childhood. As a teenager he hated being in a wheelchair, partly because he never saw anyone like him on TV.", "He played wheelchair basketball for Australia from his teens, then switched to wheelchair tennis.", "2021: the Golden Slam. All four majors plus Paralympic gold in one year, the first man in any form of tennis to do it.", "But ask who he is and you get a long list: athlete, radio host, festival founder, business co-founder, 2022 Australian of the Year."], "turn": "His self-concept isn't 'wheelchair user' or 'tennis player'. It's a whole map, and the map kept growing.", "is_": "The whole picture you hold of yourself: what you're like, what you're good at, what you care about, how you act in different rooms. A description, not a judgement.", "isnt": "Not self-esteem. Self-concept is the description; self-esteem is how you feel about it. And it isn't fixed. Year 9 maps get redrawn a lot.", "ask": "Could you describe yourself to a stranger in five sentences without any of them being good or bad?", "living": "Write five 'I am…' statements from five different rooms: home, class, sport or hobby, friends, online.", "cp": "Your VIA top strengths are part of your map.", "gw": "Mission 1, Strengths Mapping.", "notes": ["Dylan's own line is that he's proud to be disabled. If it comes up, let it sit.", "After beat 4, ask: 'Which of those would you have guessed from a photo?'", "Point out the trap: describing yourself only by one label.", "Neutral descriptions are harder than they sound. Give an example: 'I'm quiet in big groups.'", "Five rooms, five sentences."], "src": "National Museum of Australia, 2022 Australian of the Year; aoty.org.au."}, {"key": "self-image", "name": "Self-image", "level": 1, "icon": "mirror", "short": "The picture in my head of how I come across.", "fig": {"kind": "Music", "name": "Billie Eilish", "sub": "Singer-songwriter", "moment": "Why the baggy clothes?", "icon": "music"}, "hook": "How much do you change what you do because of how you think you look?", "beats": ["At 17, Billie Eilish was one of the biggest artists in the world, and famous for huge, baggy clothes.", "In a 2019 ad she explained why. She didn't want the world to know everything about her, so nobody could have an opinion on her body.", "A couple of years later she said trying to control her image like that didn't really work. People are going to think whatever they think.", "The picture in her head of how she was being seen was steering her choices."], "turn": "Self-image is the picture of how you think you come across. It's usually harsher, and more out of date, than reality.", "is_": "The picture in your head of how you look, sound and land on other people. Built partly from real feedback, partly from guesswork, and pulled around by what you scroll past.", "isnt": "Not self-concept (everything you know about yourself). And not the truth: most people's self-image is harsher than how others actually see them.", "ask": "If you watched a video of yourself talking to a friend, would it match the version in your head?", "living": "Ask one person you trust for three words they'd use to describe you. Compare them with the three you'd have guessed.", "cp": "Blakemore's 'imaginary audience' and the Social Media Mask.", "gw": "Mission 4, The Digital Self.", "notes": ["Keep the focus on choices and being judged, not on bodies. Don't discuss weight or body shape.", "Ask: 'Who was Billie actually dressing for?'", "Connect to the imaginary audience: at 14, it feels like everyone is watching. They mostly aren't.", "Some students will find this tender. Keep sharing optional.", "The three-words swap works well with a sibling or friend."], "src": "Calvin Klein #MyCalvins campaign (2019); interview with Dazed (2021)."}, {"key": "social-self", "name": "Social self", "level": 1, "icon": "users", "short": "Who I am with others, and how I think they see me.", "fig": {"kind": "Real life", "name": "Ashanti Branch", "sub": "Teacher, Ever Forward Club", "moment": "The mask activity", "icon": "mask"}, "hook": "What's on the front of your mask, and what's on the back?", "beats": ["Ashanti Branch was a maths teacher in California who noticed some of his students sliding backwards. In 2004 he started the Ever Forward Club to support them.", "He gave them a simple activity. On the front of a mask, write what people see you show. On the back, write what you hide.", "Students who looked tough, funny or chill wrote things like lonely, stressed and scared. Most were surprised they weren't the only one.", "It grew into the #MillionMaskMovement, run with young people all over the world."], "turn": "Your social self changes from room to room. That's normal, until the mask is doing all the living.", "is_": "Who you are with other people, and how you think they see you (Cooley called it the 'looking-glass self'). Adjusting between rooms is normal and healthy.", "isnt": "Not fake. A Mask of Discovery tries on new ways to be you. A Mask of Hiding locks the real you away. The problem is when you can't take it off.", "ask": "Which of the six masks do you reach for most: Funny, Chill, People Pleaser, Perfect, Tough or Social Media? In which room?", "living": "Notice one room this week where you can take the mask off. What makes that room feel safe?", "cp": "Lesson 3 (Identity and Masks) and the Ashanti Branch clip. Mask of Discovery vs Mask of Hiding.", "gw": "Mission 1, The Mask Check.", "notes": ["Students know this clip from Lesson 3. Ask what they remember before you tell the story.", "After beat 3: 'Why do you think people were surprised?'", "Re-state the normalising line: masks of discovery are part of growing up.", "Answer silently, by holding up fingers 1 to 6 if you like.", "Links straight to psychological safety, the House of Wellbeing foundation."], "src": "Ever Forward Club (everforwardclub.org). Cooley (1902)."}, {"key": "self-esteem", "name": "Self-esteem", "level": 2, "icon": "star", "short": "How much I rate myself, and it moves.", "fig": {"kind": "Music", "name": "Ed Sheeran", "sub": "Singer-songwriter", "moment": "The stutter and the Eminem album", "icon": "music"}, "hook": "Can a bad week change how you rate yourself?", "beats": ["As a kid, Ed Sheeran had glasses, bright red hair, and, after an operation on a birthmark when he was about nine, a stutter.", "Speech therapy was slow going. Then his uncle gave him an Eminem album.", "He learned every word and rapped along to it over and over. He says that's what got rid of his stutter.", "Years later, as one of the biggest artists on earth, he's still talked about how much criticism can sting. Self-esteem moves for everyone."], "turn": "Self-esteem is a rating, and ratings go up and down. That's normal.", "is_": "Your running evaluation of yourself. It goes up after a good week and down after a bad one, and that's supposed to happen.", "isnt": "Not self-worth. Esteem is a rating that moves; worth is the floor underneath. If one bad result drops you to zero, it's the floor that's wobbling.", "ask": "Think of the last time you felt bad about yourself. Was it about something you did, or about who you are?", "living": "Each night this week, write one thing you did that you'd be proud of if a friend had done it.", "cp": "Session 9, Failure and Resilience (coming up).", "gw": "Strength in action: the practice log on your Me page.", "notes": ["Lots will know his songs. Ask who knew about the stutter.", "Ask: 'Why would rapping along help?' (It's practice, rhythm and confidence all at once.)", "Introduce esteem vs worth here. It sets up the next self.", "'Did' vs 'am' is the key distinction. Give an example of each.", "Writing it down matters more than the size of the win."], "src": "Ed Sheeran on The Howard Stern Show (2023) and at the American Institute for Stuttering gala (2015)."}, {"key": "self-worth", "name": "Self-worth", "level": 2, "icon": "anchor", "short": "That I count, regardless of how the week went.", "fig": {"kind": "Sport", "name": "Simone Biles", "sub": "Gymnast", "moment": "Tokyo 2021 to Paris 2024", "icon": "trophy"}, "hook": "What are you worth on your worst day?", "beats": ["Tokyo Olympics, held in 2021. Simone Biles, the most decorated gymnast in history, arrives as the face of the Games.", "Mid-competition she gets the 'twisties': she loses track of where she is in the air. In gymnastics that can mean serious injury.", "She pulls out of the team final and most of her events. Some people call her a quitter. She says athletes aren't just entertainment; they're human.", "Three years later in Paris she wins gold again. Her worth didn't depend on Tokyo, and it didn't depend on Paris either."], "turn": "Self-worth is the floor: you count, whatever the scoreboard says.", "is_": "The belief that you matter regardless of your results, your looks, how useful you are or how popular you are. It's the one that isn't supposed to move.", "isnt": "Not self-esteem, and not achievement. If it goes up when you win and down when you lose, that's esteem doing the work. A floor made of results isn't a floor.", "ask": "If you achieved nothing at all this year, would you still be worth the same to the people who love you? Do you believe that about yourself?", "living": "Write three things that make you you that have nothing to do with results. Keep them somewhere you'll see them.", "cp": "House of Wellbeing: psychological safety is the foundation.", "gw": "Your Support Circle.", "notes": ["Explain the twisties: gymnasts lose their sense of position mid-air. It's genuinely dangerous.", "Ask: 'Was pulling out weak or strong?' Let both views come out.", "This is the key line of Level 2. Say it slowly.", "This question can land hard. Keep it private and point to support.", "If a student struggles to find three, that's useful information for you as a tutor."], "src": "NBC Sports and Star Tribune (2021); Paris 2024 results."}, {"key": "mattering", "name": "Mattering", "level": 2, "icon": "sparkle", "short": "People notice me, and count on me for something.", "fig": {"kind": "TV", "name": "Ted Lasso", "sub": "Apple TV+, 2020", "moment": "Nate the kit man", "icon": "tv"}, "hook": "What happens when someone finally notices you?", "beats": ["Nate is the kit man at AFC Richmond. He washes the kit, gets pushed around, and is invisible to most of the players.", "The new coach, Ted Lasso, does what nobody else has. He learns Nate's name, asks how he's going, and asks what he thinks about tactics.", "Nate's ideas turn out to be good. By the end of season one, Ted makes him assistant coach.", "(Fans know season two goes sideways. Nate starts needing praise from everyone. Mattering helps, but it can't be the only thing holding you up.)"], "turn": "Mattering means being noticed, being important to someone, and being counted on. Ted gave Nate the first part. Nate's ideas earned the rest.", "is_": "Feeling you make a difference to people: someone notices how you're going, and counts on you for something. It has two halves: feeling valued, and adding value.", "isnt": "Not belonging, which is being included. And not self-worth, which is the floor that holds even when nobody's noticing.", "ask": "Name one person who'd notice if you were having a rough week, and one thing someone counts on you for.", "living": "Be someone's Ted this week. Notice someone who usually goes unnoticed, use their name, and ask their opinion.", "cp": "The Connection pillar of the House of Wellbeing.", "gw": "The Standard, and Mission 2, The Contribution Map.", "notes": ["The show has strong language. Describe it rather than playing clips unless you've checked the scene.", "Ask: 'What did Ted actually do? List the actions.' (Name, check-in, opinion.)", "The season two twist matters: mattering can't be the only support.", "If a student can't name anyone, follow up privately afterwards.", "This one works well as a whole-cohort challenge."], "src": "Ted Lasso, season 1 (Apple TV+, 2020). Rosenberg & McCullough (1981); Prilleltensky."}, {"key": "self-respect", "name": "Self-respect", "level": 2, "icon": "shield", "short": "Standing by my values and boundaries.", "fig": {"kind": "Sport", "name": "Cathy Freeman", "sub": "Sprinter", "moment": "Two flags, 1994", "icon": "trophy"}, "hook": "Would you stand by who you are if it might get you sent home?", "beats": ["1994 Commonwealth Games, Canada. Cathy Freeman, a Kuku Yalanji and Birri Gubba woman from Mackay, wins the 200m and the 400m.", "On her victory laps she carries the Aboriginal flag alongside the Australian flag. She wanted to show she was proud to be a world-class Aboriginal athlete.", "The Australian team boss says only the Australian flag should be shown and threatens to send her home.", "She carries both flags again. In 2000 in Sydney, she wins Olympic gold and does her lap with both flags in front of 112,000 people."], "turn": "Self-respect is standing by who you are and what you value, even when it costs you something.", "is_": "Treating your own values, identity and boundaries as worth defending. Acting in a way you can look back on and respect.", "isnt": "Not arrogance, and not winning every argument. It's also different from self-esteem: you can have a low day and still refuse to act against your values.", "ask": "What's one value you'd stand by even if your group laughed at it?", "living": "Notice one moment this week when you say no, or speak up, because something doesn't fit who you are.", "cp": "Session 6, Values (coming up), and The Tribunal station.", "gw": "Mission 1, Values Clarifier, and Week 2: What do I stand for?", "notes": ["Queensland story: Mackay is a long way up the coast from here.", "Ask: 'What was she risking?'", "Separate self-respect from stubbornness: it's tied to values, not ego.", "Values from their VIA results can help here.", "Small moments count: saying no to a joke at someone's expense."], "src": "National Museum of Australia, Defining Moments; AIATSIS; Australian Geographic."}, {"key": "self-acceptance", "name": "Self-acceptance", "level": 2, "icon": "smile", "short": "Owning my strengths and flaws, no hiding.", "fig": {"kind": "Sport", "name": "Turia Pitt", "sub": "Athlete and author", "moment": "From the Kimberley fire to Ironman", "icon": "trophy"}, "hook": "Can you own a part of yourself you never chose?", "beats": ["2011: Turia Pitt, 24, a mining engineer and runner, is in a 100 km ultramarathon in the Kimberley when a bushfire traps the runners.", "She is burned on 65% of her body, spends a long time in hospital and has more than 200 operations. A doctor tells her she won't run again.", "She decides to show him otherwise. In 2016 she finishes Ironman Australia, then the Ironman World Championship in Hawaii.", "She's now an author and speaker who owns her story rather than hiding from it."], "turn": "Self-acceptance is owning all of you, including the parts you didn't choose.", "is_": "Accepting your strengths, your flaws and the things you can't change, without needing to hide them. You can still want to grow.", "isnt": "Not giving up, and not 'this is just how I am, deal with it'. Acceptance is the starting line for growth, not an excuse to stop.", "ask": "What's one thing about yourself you didn't choose, but could start owning?", "living": "Finish this privately: 'One part of me I usually hide is ___. Someone who'd accept it is ___.'", "cp": "The Mask of Hiding: what does it cost to keep something hidden?", "gw": "Mission 1, The Mask Check.", "notes": ["Keep injury detail brief. Some students may have their own experience of burns or trauma.", "Ask: 'What did she have to accept before she could start training?'", "Acceptance and growth aren't opposites.", "Examples: being shorter, a learning difference, a family situation, a freckle.", "Private writing only."], "src": "Turia Pitt (Wikipedia); Runner's World (2016–17)."}, {"key": "self-compassion", "name": "Self-compassion", "level": 2, "icon": "heart", "short": "Being kind to myself when I mess up.", "fig": {"kind": "Sport", "name": "Lionel Messi", "sub": "Footballer", "moment": "The missed penalty, 2016", "icon": "trophy"}, "hook": "What would you say to a mate who missed the penalty?", "beats": ["Lionel Messi had lost four major finals with Argentina, including the 2014 World Cup final.", "2016 Copa América final: he misses his penalty in the shootout and Argentina lose again. That night he announces he's quitting international football.", "Weeks later, he changes his mind and comes back.", "2021: he wins the Copa América. 2022: he captains Argentina to the World Cup."], "turn": "Would you tell a mate who missed that penalty to quit forever? Self-compassion is giving yourself the same answer.", "is_": "Treating yourself the way you'd treat a friend when you mess up: noticing it hurts, remembering everyone fails, and talking to yourself kindly.", "isnt": "Not letting yourself off the hook, and not self-pity. People who are kind to themselves actually take more responsibility for mistakes, because owning them doesn't feel like the end of the world.", "ask": "What do you say in your head after you stuff up? Would you say that to your best friend?", "living": "Next time you mess up, say to yourself what you'd say to a friend. Out loud if you can.", "cp": "Love was one of our cohort's top VIA strengths. This is pointing it inward.", "gw": "The 'hard on yourself' card.", "notes": ["Football fans will know this. Let one tell the comeback.", "Ask: 'What do you reckon he was saying to himself that night?'", "Kristin Neff's research: self-compassion goes with more responsibility, not less.", "Most students are far harsher on themselves than on friends. Name that.", "Good one to model: say your own kind self-talk out loud."], "src": "FIFA and Reuters (2016). Neff (2003)."}, {"key": "self-regulation", "name": "Self-regulation", "level": 3, "icon": "sliders", "short": "Handling my emotions, impulses and focus.", "fig": {"kind": "Sport", "name": "Zinedine Zidane", "sub": "Footballer", "moment": "World Cup final, 2006", "icon": "trophy"}, "hook": "What happens in the second and a half between feeling it and doing it?", "beats": ["9 July 2006, World Cup final in Berlin. Zinedine Zidane, France's captain and one of the best players ever, is playing his last ever match.", "Extra time, 110th minute. Italian defender Marco Materazzi insults Zidane's family.", "Zidane turns and headbutts him in the chest. Straight red card.", "He walks off past the World Cup trophy. France lose on penalties. Twenty years on, it's still the first thing many people remember about his playing career."], "turn": "Self-regulation lives in the gap between the feeling and the action.", "is_": "The gap you can hold between feeling it and doing it. You notice the urge and get to choose. It covers emotions, impulses and attention.", "isnt": "Not 'not feeling'. Zidane had every reason to be furious. And not just willpower: the gap shrinks when you're tired, stressed or humiliated, which is worth knowing before you judge yourself by your worst moment.", "ask": "What reliably shrinks your gap: tiredness, a particular person, being embarrassed?", "living": "Pick your 'gap move' (three slow breaths, walk away, count to five) and use it once this week.", "cp": "Self-regulation was one of our cohort's lower five VIA strengths, so it's a growth area for all of us. Links to the Control pillar.", "gw": "Week 7: Can I manage myself?", "notes": ["Zidane is now coaching France, so this is current for football fans.", "Ask: 'Was he wrong to be angry? Was he wrong to headbutt?' Separate the feeling from the action.", "Key idea from Groundwork: knowing your own conditions is most of the skill.", "Share your own trigger if you're comfortable.", "Practise the gap move together right now: three slow breaths."], "src": "FIFA (2006). Groundwork selves: self-control. Baumeister (2007)."}, {"key": "self-discipline", "name": "Self-discipline", "level": 3, "icon": "target", "short": "Doing what matters, even when it's hard or boring.", "fig": {"kind": "Sport", "name": "Michael Phelps", "sub": "Swimmer", "moment": "Five years without a day off", "icon": "trophy"}, "hook": "What would you be great at if you never skipped it?", "beats": ["Michael Phelps met coach Bob Bowman at 11 at a swim club in Baltimore.", "From about 12 to 18 he trained every single day. Christmas, birthdays, no days off: more than 2,000 days in a row.", "Bowman said there were days Phelps didn't want to go. He kept turning up anyway.", "Beijing 2008: eight gold medals at one Games, a record. He finished with 23 Olympic golds."], "turn": "Self-discipline is doing what matters when you don't feel like it.", "is_": "Doing what matters to you even when it's hard, boring or nobody's watching. Best built from routines, so you don't have to win the argument with yourself every day.", "isnt": "Not punishing yourself or never resting. Phelps had a coach planning his recovery too. And it's not motivation: discipline is what carries you on the days motivation doesn't turn up.", "ask": "What's one thing you'd be great at if you did 15 minutes of it every day?", "living": "Pick one 10-minute habit and do it five days in a row. Tick it off somewhere you can see.", "cp": "The Control pillar: what's in your control is the next 10 minutes.", "gw": "Habits, and Week 5: Do I do hard things?", "notes": ["Big numbers grab them. 2,000+ days is about the same as from Year 4 to now.", "Ask: 'How do you keep going on the days you don't feel like it?'", "Make the point about rest: discipline isn't burnout.", "Ideas: reading, shooting practice, an instrument, stretching.", "Five days, not seven. Keep it achievable."], "src": "Bob Bowman on 60 Minutes (2008) and in Live Happy magazine."}, {"key": "self-motivation", "name": "Self-motivation", "level": 3, "icon": "flame", "short": "Finding my own reasons to start and keep going.", "fig": {"kind": "Sport", "name": "Johnathan Thurston", "sub": "Rugby league", "moment": "'Too small to make it'", "icon": "trophy"}, "hook": "What keeps you going when nobody believes in you?", "beats": ["Brisbane kid, junior footy at Souths Sunnybank. He dreamed of playing for the Broncos.", "Scouts kept saying he was too small, too skinny, too slow. He missed out on scholarships and nearly gave up.", "At 18 no NRL club would sign him. The Bulldogs finally gave him a chance, and he won a premiership with them in 2004.", "At the North Queensland Cowboys: four Dally M Medals and the 2015 premiership. Many call him the greatest ever."], "turn": "Other people's belief wasn't what kept him going. He found his own reasons.", "is_": "Finding your own reasons to start and keep going. It's strongest when it comes from inside: you value it, you enjoy it, or it's part of who you are.", "isnt": "Not just 'proving them wrong'. Spite can get you started but it runs out. Reasons you actually care about last longer. And it's not waiting to feel motivated: often, starting comes first.", "ask": "What's something you do even when nobody's making you? What's the reason underneath it?", "living": "Write your 'why' for one goal in one sentence. Put it where you'll see it before you start.", "cp": "JT was in the Session 5 Dossier. Links to the Enjoyment pillar of the House of Wellbeing.", "gw": "Mission 2, What Matters (your motivated self).", "notes": ["Queensland legend. Plenty of students will know him.", "Ask: 'Why do you think he didn't quit?'", "Inside reasons (Ryan and Deci): value, enjoyment, identity.", "Push past 'because I have to'.", "Short, specific whys work best."], "src": "NRL.com; Sport Australia Hall of Fame. Ryan & Deci (2000)."}, {"key": "self-efficacy", "name": "Self-efficacy", "level": 4, "icon": "check", "short": "Believing I can do the specific thing in front of me.", "fig": {"kind": "Sport", "name": "Bannister and Landy", "sub": "Milers, 1954", "moment": "The four-minute mile", "icon": "trophy"}, "hook": "What changes when you see someone do the 'impossible'?", "beats": ["For years, the four-minute mile was treated like a wall. Aussie John Landy kept running just over four minutes, and said he doubted anyone would break it.", "6 May 1954: Roger Bannister, a junior doctor in England, runs 3:59.4.", "Just 46 days later, Landy runs 3:58 in Finland.", "The track hadn't changed. Landy's legs hadn't changed. What changed was what he believed was possible."], "turn": "Watching someone like you do it is one of the four ways self-efficacy grows.", "is_": "Your belief that you can do this particular thing. It grows from small real wins, from watching people like you do it, from someone you trust saying you can, and from reading nerves as 'getting ready'.", "isnt": "Not general confidence: you can have heaps for one thing and none for another. And not the same as believing effort pays off. You need both.", "ask": "When something goes badly, is your first thought about what you'd do differently, or about what you're like?", "living": "Pick one thing you think you 'can't' do. Find someone like you who does it, and ask how they started.", "cp": "The Dossier possible selves: other people's stories as proof it can be done.", "gw": "Week 5: Do I do hard things?", "notes": ["Landy is Australian, which makes this a good local angle.", "Ask: 'What changed in those 46 days?'", "Name Bandura's four sources and get students to spot them.", "This is the Groundwork self-check, word for word.", "Older students or siblings are good 'people like you'."], "src": "World Athletics (2004 Landy interview). Bandura (1977)."}, {"key": "self-confidence", "name": "Self-confidence", "level": 4, "icon": "zap", "short": "Feeling sure enough of myself to have a go.", "fig": {"kind": "Sport", "name": "Usain Bolt", "sub": "Sprinter", "moment": "The deal with his coach, 2007", "icon": "trophy"}, "hook": "Is confidence something you have, or something you build?", "beats": ["2007: Usain Bolt is a 200m runner. His coach Glen Mills wants him training for the 400m. Bolt wants to run the 100m.", "They make a deal: break the Jamaican 200m record and you can run a 100m. He breaks a 36-year-old record. His first question: 'When is the 100m?'", "His first 100m: 10.03 seconds. Less than a year later: world record.", "Beijing 2008, Berlin 2009: world records in both events. The confidence came from wins stacking up, not from a speech."], "turn": "Confidence is built from lots of specific 'I did it's.", "is_": "Feeling sure enough of yourself to have a go. The general feeling is usually built out of lots of specific ones.", "isnt": "Not self-esteem ('I'm alright'), and not cockiness. And not something you wait for: doing the thing is what produces it.", "ask": "Name one thing you're genuinely confident at. What did you do to get there? That's the method for everything else.", "living": "Do one small thing this week that you'd usually wait to 'feel ready' for.", "cp": "Courage was one of our cohort's lower VIA strengths. Confidence and courage grow together.", "gw": "Mission 1, The weekly challenge.", "notes": ["Ask a sprinter in the room to say what 10.03 means.", "Ask: 'Why did breaking the 200m record matter for the 100m?'", "Bust the myth: you don't need to feel confident to start.", "Get a few volunteers to share their method.", "Keep it small: ask a question in class, try out for something."], "src": "NBC Sports; Jamaica Gleaner (2008)."}, {"key": "self-trust", "name": "Self-trust", "level": 4, "icon": "compass", "short": "Backing my judgement and keeping promises to myself.", "fig": {"kind": "Sport", "name": "Kurt Fearnley", "sub": "Wheelchair racer", "moment": "Crawling Kokoda, 2009", "icon": "trophy"}, "hook": "Do you trust yourself to finish what you start?", "beats": ["Kurt Fearnley was born without the lower part of his spine and grew up in Carcoar, a small town in NSW.", "He became one of the best wheelchair racers in the world: Paralympic gold, and wins in New York and Chicago.", "In 2009, just weeks after winning the New York Marathon, he crawls the 96 km Kokoda Track in Papua New Guinea on his hands, to raise awareness of men's health.", "Heat, mud and steep mountains, for about ten days. He'd planned, trained and knew his body. He backed himself, and he finished."], "turn": "Self-trust is backing your own judgement, and it's earned by keeping promises to yourself.", "is_": "Relying on your own judgement and keeping the promises you make to yourself. Every promise you keep is a deposit.", "isnt": "Not ignoring advice or never asking for help. Kurt crawled with family, friends and guides. Self-trust is knowing when to back yourself and when to lean on others.", "ask": "When did you last make a promise to yourself and keep it? When did you last break one?", "living": "Make one small promise to yourself this week, and keep it.", "cp": "Honesty was one of our cohort's lower VIA strengths. Honesty with yourself comes first.", "gw": "Week 4: Can people trust me? (One promise, kept every day.)", "notes": ["Kokoda links to Anzac history; some students will have family who have walked it.", "Ask: 'What would you need to trust about yourself to try that?'", "Promises to yourself are the training ground for trust.", "Normalise broken promises. Everyone has them.", "Tiny promises work best: lights out by 10, one page of reading."], "src": "Laureus (2010); NSWIS; Kokoda Track records."}, {"key": "self-determination", "name": "Self-determination", "level": 5, "icon": "flag", "short": "Making choices that are truly my own.", "fig": {"kind": "Sport", "name": "Ash Barty", "sub": "Tennis, from Ipswich QLD", "moment": "Walking away, twice", "icon": "trophy"}, "hook": "Whose choice is your life?", "beats": ["2014: Ash Barty is 18, a tennis prodigy, but homesick and burnt out. After a first-round loss at the US Open, she steps away from tennis.", "She plays cricket for the Brisbane Heat in the first Women's Big Bash League, with no formal training.", "In 2016 she comes back to tennis on her own terms: French Open 2019, Wimbledon 2021, Australian Open 2022, world No. 1.", "March 2022: aged 25, and still world No. 1, she retires. She says she knows in her heart it's right."], "turn": "Every big decision was hers. That's self-determination.", "is_": "Making choices that are truly your own. Research says we thrive with three things: choice (autonomy), getting better (competence) and connection (relatedness).", "isnt": "Not doing whatever you want or ignoring everyone. Barty had a tight team around her. It's about owning the choice, not making it alone.", "ask": "How many things you do each week did you actually choose? Which one would you choose again?", "living": "Pick one 'have to' this week and find the part of it you can choose: how, when or why.", "cp": "The Control pillar of the House of Wellbeing.", "gw": "Mission 1, Values Clarifier, and Mission 2.", "notes": ["Local hero, from the Ipswich and Springfield area.", "Ask: 'Was stepping away at 18 brave or risky?'", "Self-Determination Theory: autonomy, competence, relatedness.", "Many 'have tos' still have a choice inside them.", "Example: you have to do homework, but you choose when and where."], "src": "WTA; InDaily (2022). Deci & Ryan (1985)."}, {"key": "self-advocacy", "name": "Self-advocacy", "level": 5, "icon": "mega", "short": "Speaking up for what I need and believe.", "fig": {"kind": "Sport", "name": "Naomi Osaka", "sub": "Tennis", "moment": "French Open, 2021", "icon": "trophy"}, "hook": "What happens when you say what you actually need?", "beats": ["May 2021: Naomi Osaka, a four-time Grand Slam champion, says she won't do press conferences at the French Open. She says they give her huge waves of anxiety.", "Organisers fine her $15,000 and threaten to throw her out.", "She withdraws, and shares that she's been dealing with depression for a long time.", "Some people criticised her. Many thanked her. It started a worldwide conversation about athletes' mental health."], "turn": "Self-advocacy is saying what you need, clearly, even when it's uncomfortable.", "is_": "Speaking up for what you need and what you believe, to the right person, in a way they can hear.", "isnt": "Not complaining or demanding. Osaka herself said her timing and her message could have been clearer, and that's part of the skill too.", "ask": "Is there something you need at school, at home or with friends that you haven't asked for? Who's the right person to ask?", "living": "Use this script once this week: 'I've noticed ___. I need ___. Could we ___?'", "cp": "The Speed Dating boundary communication activity.", "gw": "Support Circle conversation scaffolds.", "notes": ["Handle the mental health part matter-of-factly and without drama.", "Ask: 'Was there a better way she could have asked?'", "Advocacy is a skill. It can be practised.", "Prompt: teacher, coach, parent, friend. Who is the right person?", "Write the script on the board for them to copy."], "src": "CBS News, Al Jazeera (2021)."}, {"key": "self-authorship", "name": "Self-authorship", "level": 5, "icon": "pen", "short": "Writing my own story, not borrowing someone else's.", "fig": {"kind": "Music", "name": "Taylor Swift", "sub": "Singer-songwriter", "moment": "Taylor's Version", "icon": "music"}, "hook": "Who owns your story?", "beats": ["Taylor Swift wrote her own songs from her early teens. But the recordings of her first six albums were owned by her old record label.", "In 2019 those recordings were sold. She said she was never given a fair chance to buy them herself.", "Her answer: re-record every album as 'Taylor's Version', so she'd own the new ones. Fans switched over in their millions.", "May 2025: she bought back the originals. Everything she'd ever made now belonged to her."], "turn": "Self-authorship is writing your own story instead of letting other people write it for you.", "is_": "Building your own beliefs, values and identity, rather than just borrowing them from parents, friends or your feed. Moving from 'what do they want?' to 'what do I think?'", "isnt": "Not rejecting everything you were taught. You can keep plenty of it, as long as you've checked it and chosen it.", "ask": "Name one belief you hold. Did you choose it, or did you absorb it?", "living": "Write one belief in your own words: where it came from, and whether you'd keep it.", "cp": "Session 6 (Values) and Session 10 (Purpose and Legacy), both coming up.", "gw": "Mission 1, Identity Letter, and Week 10: your Character Code.", "notes": ["Swifties in the room will happily explain masters. Let them.", "Ask: 'Why did owning it matter so much to her?'", "Baxter Magolda: from following external formulas to an internal voice.", "Example beliefs: about school, sport, fairness, faith, friendship.", "Keeping a belief you've checked is still authorship."], "src": "NPR and Associated Press (May 2025). Baxter Magolda (2001)."}, {"key": "actual-self", "name": "Actual self", "level": 6, "icon": "pin", "short": "Who I am right now.", "fig": {"kind": "Film", "name": "Moana", "sub": "Disney, 2016", "moment": "'I am Moana'", "icon": "film"}, "hook": "If you dropped a 'you are here' pin, where would it land?", "beats": ["Moana is supposed to become chief of her island and stay inside the reef. But she keeps being pulled towards the ocean.", "She sets out to save her people, and nearly gives up after failing.", "At her lowest point, she stops and says out loud who she is: where she comes from, what she's done, what she loves.", "Knowing exactly where she stood gave her somewhere to launch from."], "turn": "Your actual self is your honest 'you are here' pin.", "is_": "Who you are right now: your real strengths, habits, values and struggles. Not who you wish you were, and not who others want you to be.", "isnt": "Not the final version. Your actual self in Year 9 is a starting point, not a verdict.", "ask": "If you had to stand up and say 'I am…' like Moana, what three things would you say?", "living": "Write your 'you are here' pin: three things that are true about you now, and one you're working on.", "cp": "Your VIA top strengths are evidence for your actual self.", "gw": "Mission 1, Your Story So Far.", "notes": ["Describe the scene. Don't play the song unless licensing allows it.", "Ask: 'Why did saying it out loud help her?'", "This is the start of the possible-selves set: actual, ideal, ought, feared, possible.", "Honest beats impressive.", "Keep the pin. They'll use it for the next four selves."], "src": "Moana (Disney, 2016). Higgins (1987), self-discrepancy theory."}, {"key": "ideal-self", "name": "Ideal self", "level": 6, "icon": "sun", "short": "Who I hope to become.", "fig": {"kind": "Music", "name": "Troye Sivan", "sub": "Singer, from Perth", "moment": "From bedroom YouTube to global pop", "icon": "music"}, "hook": "Who are you trying to become?", "beats": ["Born in Johannesburg, raised in Perth. At 12 he starts posting singing videos on YouTube from his bedroom.", "He pictured a music career long before anyone offered him one, and kept making videos, songs and acting for years.", "2013: EMI Australia signs him. 2015: his debut album Blue Neighbourhood, and the single 'Youth' cracks the US top 40.", "He's now one of Australia's biggest international pop stars."], "turn": "An ideal self works like a magnet: it pulls you towards the future you want.", "is_": "Who you hope to become: the person you'd be if things went your way. It shows you which direction to move in.", "isnt": "Not perfection, and not someone else's dream for you (that's the ought self). If the ideal is too far away it can make you feel worse. The gap should pull, not crush.", "ask": "Picture you at 25. What five qualities would you want people to use to describe you?", "living": "Do one thing this week that 25-year-old you would thank you for.", "cp": "Troye was one of the Session 5 Dossier cards.", "gw": "Week 1: Who am I becoming? (Five qualities at 25), and Future Self.", "notes": ["Callback to the Dossier: ask who remembers his card.", "Ask: 'What did he keep doing before anyone noticed?'", "Higgins: the actual-to-ideal gap is where growth happens.", "Qualities, not achievements: kind, brave, funny, reliable.", "Small and concrete."], "src": "Troye Sivan (Wikipedia); i-D magazine. Rogers (1959); Higgins (1987)."}, {"key": "ought-self", "name": "Ought self", "level": 6, "icon": "clip", "short": "Who others expect me to be.", "fig": {"kind": "Sport", "name": "Andre Agassi", "sub": "Tennis", "moment": "His memoir, Open", "icon": "trophy"}, "hook": "Are you living your plan, or someone else's?", "beats": ["Before Andre Agassi was born, his dad had decided he'd be a tennis champion. He built a court in the backyard and a ball machine Andre called 'the dragon'.", "As a kid Andre hit around 2,500 balls a day. At 13 he was sent away to a tennis academy in Florida.", "He became world No. 1, won eight Grand Slams and Olympic gold.", "Then in his memoir Open he revealed he'd hated tennis for most of his life. He said he never chose it. Later he found his own reason to play: a school he set up for kids in Las Vegas."], "turn": "The ought self is who other people expect you to be. Living only in it gets heavy.", "is_": "Who you think you should be, based on what parents, coaches, friends or culture expect. The gap between actual and ought tends to feel like pressure and anxiety.", "isnt": "Not always bad. Some expectations are good ones you'll choose to keep. The question is whether you've checked them and made them yours.", "ask": "Whose voice is loudest when you think 'I should…'? Do you agree with it?", "living": "Write three 'I should…' sentences. Cross out 'should' and write either 'I choose to' or 'I don't actually want to'.", "cp": "Performing vs Showing Up, and the People Pleaser mask.", "gw": "Week 8: Who is shaping me?", "notes": ["Keep it to 'pushed hard'. Don't go into the darker parts of the memoir.", "Ask: 'How can you be great at something you hate?'", "Higgins: the actual-to-ought gap is where pressure lives.", "Be careful not to set students against parents. Expectations often come from love.", "This one often sparks good conversations at home."], "src": "NPR Fresh Air interview (2009). Higgins (1987)."}, {"key": "feared-self", "name": "Feared self", "level": 6, "icon": "storm", "short": "Who I don't want to become.", "fig": {"kind": "Film", "name": "Star Wars", "sub": "The Empire Strikes Back, 1980", "moment": "Luke in the cave", "icon": "film"}, "hook": "What's the version of you you'd never want to be?", "beats": ["Luke Skywalker is training with Yoda on the swamp planet Dagobah.", "Yoda sends him into a dark cave. Inside, Luke meets a vision of Darth Vader and they fight.", "Luke strikes Vader down. The mask cracks open, and the face inside is Luke's own.", "His deepest fear isn't Vader. It's becoming like Vader. That fear shapes the choices he makes from then on."], "turn": "A feared self is who you don't want to become. Used well, it keeps you on track.", "is_": "The version of you that you're afraid of becoming. It can push you away from paths you don't want.", "isnt": "Not a prediction. And fear works best when it's paired with a hoped-for self: running away from something is weaker than running towards something.", "ask": "What's one version of you you don't want to become? What's the opposite version you do want?", "living": "Write your feared self in one line, and your hoped-for self opposite it. Do one thing this week that moves you towards the second.", "cp": "Session 5, Fear and Vulnerability.", "gw": "Future Self.", "notes": ["Most will know the scene, or can picture it from the description.", "Ask: 'Why show Luke his own face?'", "Markus and Nurius: feared selves motivate most when balanced with a hoped-for self.", "Keep it general. Avoid naming real people as feared selves.", "Always finish on the hoped-for side."], "src": "The Empire Strikes Back (1980). Markus & Nurius (1986)."}, {"key": "possible-selves", "name": "Possible selves", "level": 6, "icon": "branch", "short": "All the futures I can imagine.", "fig": {"kind": "Sport", "name": "Ellyse Perry", "sub": "Cricket and soccer", "moment": "Two sports for Australia at 16", "icon": "trophy"}, "hook": "Do you have to pick your future yet?", "beats": ["Growing up in Sydney, Ellyse Perry played everything: cricket, soccer, tennis, athletics, touch and golf.", "In 2007, at 16, she debuted for Australia in cricket. About two weeks later, she debuted for the Matildas.", "She became the first Australian to play in both a cricket World Cup and a soccer World Cup.", "Around 2014 she chose cricket, and became one of the greatest cricketers of all time."], "turn": "She kept several futures open, tried them for real, then chose one.", "is_": "The whole range of future versions of you that you can imagine: hoped-for, feared and likely. Having a few lets you explore before you commit.", "isnt": "Not having to decide now. Year 9 is meant to be the exploring phase. Shutting options down too early (foreclosure) is the bigger risk.", "ask": "Name three different futures you can see yourself in. What's one small step towards each?", "living": "Try one new thing this week that's linked to a possible self you've never tested.", "cp": "The Dossier, our possible-selves cards from Session 5.", "gw": "Mission 2 pathways, and Next Chapter.", "notes": ["Sporty students will love this one; widen it to music, trades, study, travel.", "Ask: 'Why not just pick one sport at 12?'", "Erikson and Marcia: exploration first, then commitment.", "Encourage wildly different futures.", "A club, a taster lesson, a conversation with someone in a job."], "src": "Ellyse Perry (Wikipedia; Penguin author bio). Markus & Nurius (1986)."}, {"key": "authentic-self", "name": "Authentic self", "level": 7, "icon": "star", "short": "When who I am, what I value and how I act line up.", "fig": {"kind": "Film", "name": "The Greatest Showman", "sub": "2017", "moment": "'This Is Me'", "icon": "film"}, "hook": "What would it take to walk back into the room as yourself?", "beats": ["The Greatest Showman is a musical inspired by circus showman P.T. Barnum.", "Lettie Lutz, the bearded lady (played by Keala Settle), and the other performers are shut out of a fancy party because Barnum is embarrassed by them.", "Instead of hiding, Lettie leads them straight back in, singing 'This Is Me': a song about refusing to be ashamed of who you are.", "It won the Golden Globe for Best Original Song and became an anthem for anyone who's ever felt left out."], "turn": "Your authentic self is when who you are, what you value and how you act all line up, whoever's watching.", "is_": "When your inside and outside match: you act in line with your values and identity across different rooms. Research links feeling authentic with wellbeing.", "isnt": "Not 'being exactly the same everywhere', and not saying every thought out loud. You'll still adjust between rooms. Authentic means the core stays you.", "ask": "Where do you feel most like the real you? What's different about that place?", "living": "This week, do one thing as the real you in a room where you'd usually wear a mask.", "cp": "Showing Up vs Performing, The Vault, and psychological safety in the House of Wellbeing.", "gw": "Week 10, your Character Code, and Mission 4, Meaning.", "notes": ["The final level. Recap the climb from Level 1 if you've done the series.", "Ask: 'What made Lettie walk back in?'", "Harter: authenticity and 'false self' behaviour in teens.", "Let a few share their place out loud, if they're willing.", "End warmly. This is the goal the whole framework points to."], "src": "The Greatest Showman (2017). Harter (2002); Sutton (2020)."}];
