# Checks for the v3 branch. Runs on pushes to v3 and on pull requests into it.
# Nothing here deploys, and nothing here has a secret: the access tests run
# against an in-memory Postgres inside the job (tests/v3/access/db.ts), and
# the second job starts a throwaway Supabase database inside the runner.
name: v3 checks

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

permissions:
  contents: read

concurrency:
  group: v3-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Safety phrase lists
        run: npm run check:phrases
      - name: Unit and access tests
        run: npm test
      - name: Schema draft loads and keeps its rules
        run: npm run check:schema
      - name: Selves master validates
        run: npx --yes tsx scripts/v3/validate-selves.ts
      - name: Build
        run: npm run build

  # Does the migration apply on real Supabase, with its own roles, auth schema
  # and default grants (which the access tests only stub)?
  real-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local Supabase database and apply the v3 migrations
        run: supabase db start --workdir supabase/v3
      - name: Apply them again from empty, as a new project would
        run: supabase db reset --workdir supabase/v3
      - name: Every v3 table exists and has row security on
        env:
          PGPASSWORD: postgres
        run: |
          q() { psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -At -v ON_ERROR_STOP=1 -c "$1"; }
          tables=$(q "select count(*) from pg_tables where schemaname = 'public'")
          open=$(q "select count(*) from pg_tables where schemaname = 'public' and not rowsecurity")
          anon=$(q "select count(*) from information_schema.role_table_grants where table_schema = 'public' and grantee = 'anon'")
          echo "tables: $tables, without row security: $open, table grants to anon: $anon"
          test "$tables" -eq 31
          test "$open" -eq 0
          test "$anon" -eq 0
      - name: Access tests against this database, nothing stubbed
        env:
          GW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run tests/v3/access --no-file-parallelism
